# ROS 2 参数按节点分组。默认启动只预览，串口和动作由 launch 参数启用。
# 采集的是原图，下面的 preview_width / preview_height 是电脑上看到的尺寸。
camera_node:
  ros__parameters:
    width: 1280
    height: 720
    FPS: 60
    FOURCC: MJPG
    max_pitch_deg: 80  # 0度水平，向下为正；限位约80.95度，整数指令最大80度。

inference_node:
  ros__parameters:
    yolo:
      model_path: ""
      conf_threshold: 0.6
      iou_threshold: 0.45

perception_node:
  ros__parameters:
    background_filter:
      enabled: true
      horizontal_fov_deg: 70.0
      horizon_margin_px: 16.0
    supplies_on_left: true

safety_detector_node:
  ros__parameters:
    hsv:
      # 顺序为 Hmin、Smin、Vmin、Hmax、Smax、Vmax。H 可以跨越零点。
      purple: [125, 100, 25, 155, 255, 255]
      red: [155, 70, 35, 2, 255, 255]
      blue: [98, 22, 35, 145, 150, 255]

desktop_server_node:
  ros__parameters:
    preview_width: 640
    preview_height: 360
    jpeg_quality: 65

serial_node:
  ros__parameters:
    uart:
      baudrate: 115200
      device: /dev/ttyS6

task_node:
  ros__parameters:
    point:
      # GoTo 算像素误差时用的参考点，坐标以相机原图为准。
      x0: 640.0
      y0: 550.0
    distribute:
      # 临时动作：0-3秒前进，3-8秒边前进边旋转；由同一计时器逐帧判断。
      # 当前动作：先直推5秒，再前进转圈7秒；后段误差-125，电脑约0.20m/s与0.90rad/s，扩大推转半径。
      angle: 0
      move_ms: 5000
      scatter_ms: 7000
      base_forward: -100
      scatter_forward: -125
      base_turn: 281
    trans:
      # 候选参数：实际速度由STM32的PID决定，以下是像素误差限幅。
      search_camera_1: 30
      search_camera_2: 20
      first: true
      confirm_frames: 3
      align_px: 20
      camera_settle_ms: 400
      search_score_min: 10
      lost_move: 200
      lost_move_ms: 1000
      track_gate_px: 150
      turn_only_px: 80
      turn_limit_px: 100
      move_limit_px: 180
      distance_reward: 0.002
      score:
        green: 5.0
        black: 5.0
        orange: 2.0
        count_reward: 4.0
        our_safe: 6.0
    grab:
      # 沿用搜寻相机角度。720p 下检测框底边进入此范围才合爪，实机需标定。
      y_min: 620
      y_max: 690
      align_px: 26
      forward_px: 105
      confirm_frames: 3
      settle_ms: 500
      timeout_ms: 9000

approach_test_node:
  ros__parameters:
    color: orange
    point:
      x0: 640.0
      y0: 550.0
    turn_limit_px: 100
    move_limit_px: 180
